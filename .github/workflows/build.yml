name: Build and Package FocusTimer

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 체크아웃 소스코드
        uses: actions/checkout@v4

      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v3

      # 1) JavaFX SDK 다운로드 (러너에 없으니 직접 받아야 함)
        shell: pwsh
        run: |
          $ver = "17.0.15"
          $zip = "openjfx-$ver_windows-x64_bin-sdk.zip"
          $url = "https://download2.gluonhq.com/openjfx/$ver/$zip"
          Invoke-WebRequest $url -OutFile $zip
          Expand-Archive $zip -DestinationPath .
          echo "JAVAFX_SDK=$PWD\javafx-sdk-$ver" >> $env:GITHUB_ENV

      # 2) fatJar + jpackage input 준비 (네 build.gradle.kts에 fatJar / prepJpackageInput 있어야 함)
      - name: Build fatJar and prepare jpackage input
        shell: pwsh
        run: |
          .\gradlew.bat clean fatJar prepJpackageInput

      # 3) 설치형 exe 대신: 포터블 app-image 생성 (WiX 불필요)
- name: Create portable app-image
  shell: pwsh
  run: |
    $input = "$PWD\build\jpackage\input"
    $out   = "$PWD\build\jpackage-out"

    & "$env:JAVA_HOME\bin\jpackage.exe" `
      --type app-image `
      --name FocusTimer `
      --app-version 1.0 `
      --input $input `
      --main-jar "FocusTimer-all.jar" `
      --main-class "TimerApp" `
      --dest $out `
      --module-path $input `
      --add-modules "javafx.controls,javafx.graphics,javafx.base"

      # 4) 포터블 폴더를 zip으로 묶어서 업로드
      - name: Zip portable output
        shell: pwsh
        run: |
          Compress-Archive -Path ".\build\jpackage-out\FocusTimer" -DestinationPath ".\FocusTimer_portable.zip" -Force

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: FocusTimer_portable
          path: FocusTimer_portable.zip


